[project]
name = "electricitymap-contrib-types"
version = "1.9.0"
description = "Type definitions for Electricity Maps"
authors = [{ name = "Electricity Maps", email = "app@electricitymaps.com" }]
requires-python = ">= 3.10, < 3.14"
license = "AGPL-3.0-or-later"
dependencies = [
    "pydantic>=1.10.17,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "src/electricitymap",
]
exclude = [
    "**/tests",
    "**/test_*.py",
]

[tool.hatch.build.targets.wheel]
include = [
    "src/electricitymap",
]
exclude = [
    "**/tests",
    "**/test_*.py",
]
packages = ["src/electricitymap"]

[tool.ruff]
extend = "../../pyproject.toml"
# This package is published separately and still supports Python 3.10
# (see requires-python), so keep it off 3.11-only syntax like StrEnum.
target-version = "py310"
