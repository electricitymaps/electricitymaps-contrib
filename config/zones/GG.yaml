capacity:
  oil:
    - _comment: >-
        Vale Power Station dispatchable thermal capacity. The 2021 base year is given as 149 MW,
        with the strategy modelling 138 MW from 2025; GEL restored 11 MW of standby capacity in
        September 2025. Installed nominal capacity, not expected output.
        https://www.gov.gg/CHttpHandler.ashx?id=168030&p=0 (Electricity Strategy for Guernsey,
        P.2023/55, Table 1)
      datetime: '2021-01-01'
      source: gov.gg (Electricity Strategy for Guernsey, P.2023/55, Table 1)
      value: 149.0
  solar:
    - _comment: >-
        2.2 MWp of installed island solar PV in the 2021 base year.
        https://www.gov.gg/CHttpHandler.ashx?id=168030&p=0 (P.2023/55, Table 1)
      datetime: '2021-01-01'
      source: gov.gg (Electricity Strategy for Guernsey, P.2023/55)
      value: 2.2
    - _comment: >-
        Island-wide installed solar PV (GEL reports "over 4 MW"); the States target is 5 MW by 2025
        and 10 MW by 2028. https://www.electricity.gg/media/0vnltnkt/annual-report-2025.pdf
      datetime: '2025-01-01'
      source: Guernsey Electricity Annual Report 2025
      value: 4.0
