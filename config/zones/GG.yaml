fallbackZoneMixes:
  powerOriginRatios:
    - _comment: >-
        Physical basis. 93% of distributed electricity was imported in calendar 2021
        (GEL carbon reporting, which splits imports by cancelled certificates); that
        share is blended at the French generation mix because GJ1 delivers French
        grid power via Jersey, so the import origin is the exporting zone's mix. The
        remaining 7% is on-island generation, split between Vale Power Station
        (26,860 MWh) and community PV (390 MWh).
      _source: GEL carbon reporting blended with the French generation mix (Ember)
      _url:
        - https://www.electricity.gg/about/our-company/carbon-reporting/
        - https://ember-energy.org/data/yearly-electricity-data/
      datetime: '2021-01-01'
      value:
