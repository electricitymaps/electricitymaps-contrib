fallbackZoneMixes:
  powerOriginRatios:
    - _comment: >-
        Physical basis. JEC reports 94% of the Island's requirements imported from
        France in FY25, 1% from on-island solar (Moulin a Vent) and the balance of
        5% from the Energy from Waste plant. The imported share is blended at the
        French generation mix, because the Normandie 1/2 link delivers French grid
        power, so the import origin is the exporting zone's mix rather than the
        guarantees of origin behind JEC's published fuel mix disclosure (nuclear
        62.4%, hydro 31.2%). FY25 is October 2024 to September 2025, against
        calendar-year French generation.
      _source: JEC Annual Report 2025 blended with the French generation mix (Ember)
      _url:
        - https://www.jec.co.uk/media/bhtpjcjx/annual-report-2025.pdf
        - https://ember-energy.org/data/yearly-electricity-data/
