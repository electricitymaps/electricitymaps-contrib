capacity:
  biomass:
    - _comment: >-
        Energy from Waste plant at La Collette, up to 8 MW of which is supplied to Jersey
        Electricity. JE holds a 25-year power purchase agreement signed in 2008; the plant supplied
        5.3% of units in FY25.
      datetime: '2025-01-01'
      source: jec.co.uk
      value: 8.0
  oil:
    - _comment: >-
        Three Rolls-Royce gas turbines at Queen's Road (76 MW in total), four 11.5 MW Sulzer
        diesels at La Collette (46 MW) and the 5.5 MW "Diesel 5" Sulzer black-start set commissioned
        in 2017, which brings the installed total to 127.5 MW. The redundant 45 MW steam turbine,
        now being demolished, is excluded.
      datetime: '2025-01-01'
      source: jec.co.uk
      value: 127.5
  solar:
    - _comment: >-
        On-island solar PV. The 4.3 MWp Moulin a Vent farm in St Clement was commissioned in
        February 2025 and is stated by Jersey Electricity to have doubled the island's solar
        generating capacity, giving roughly 8.6 MWp; the target is 25 MWp by 2028.
      datetime: '2025-02-01'
      source: jec.co.uk
      value: 8.6
