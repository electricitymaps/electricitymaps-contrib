# Dependabot config file

version: 2
updates:
  # Maintain the workflow dependencies.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    reviewers:
      - 'VIKTORVAV99'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-patch']

  # Ensure ruff and tzdata is updated.
  # Use the uv ecosystem so uv.lock is relocked alongside pyproject.toml;
  # the pip ecosystem only edits pyproject.toml.
  - package-ecosystem: 'uv'
    directory: '/'
    schedule:
      interval: 'monthly'
    allow:
      - dependency-name: 'ruff'
      - dependency-name: 'tzdata'
    # Match `exclude-newer` in pyproject.toml, or the relock fails to
    # resolve a release that is less than 3 days old.
    cooldown:
      default-days: 3
    reviewers:
      - 'VIKTORVAV99'

  # Maintain the devcontainer dependencies.
  - package-ecosystem: 'devcontainers'
    directory: '/'
    schedule:
      interval: 'monthly'
    reviewers:
      - 'VIKTORVAV99'
